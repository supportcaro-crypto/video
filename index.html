<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pluto Video Engine - تجربة</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
    background: #0f0f14;
    color: #eee;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px;
  }
  header {
    width: 100%;
    max-width: 900px;
    text-align: center;
    margin-bottom: 16px;
  }
  h1 { font-size: 1.4rem; margin-bottom: 4px; }
  p.sub { color: #999; font-size: 0.9rem; }
  .status {
    display: inline-block;
    margin-top: 8px;
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 0.8rem;
    background: #1a3a1a;
    color: #4ade80;
  }
  .frame-wrap {
    width: 100%;
    max-width: 900px;
    background: #1a1a22;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 4px 20px rgba(0,0,0,0.4);
  }
  iframe {
    width: 100%;
    height: 900px;
    border: none;
    display: block;
  }
  .fallback {
    margin-top: 16px;
    font-size: 0.85rem;
    color: #999;
    text-align: center;
  }
  .fallback a {
    color: #60a5fa;
    text-decoration: none;
  }
  .loading {
    position: absolute;
    color: #666;
    font-size: 0.9rem;
    padding: 40px;
    text-align: center;
    width: 100%;
  }
</style>
</head>
<body>

<header>
  <h1>🎬 Pluto Video Engine</h1>
  <p class="sub">صفحة تجربة مؤقتة - توليد فيديو من نص عبر CogVideoX-5B</p>
  <span class="status">● متصل بـ HuggingFace Space</span>
</header>

<div class="frame-wrap">
  <iframe
    src="https://mahmoudtele-pluto-video-engine.hf.space"
    title="Pluto Video Engine"
    allow="clipboard-write"
    loading="lazy">
  </iframe>
</div>

<p class="fallback">
  إذا ما ظهرت الواجهة بالأعلى، افتحها مباشرة من هون:
  <br>
  <a href="https://mahmoudtele-pluto-video-engine.hf.space" target="_blank">
    https://mahmoudtele-pluto-video-engine.hf.space
  </a>
</p>

</body>
</html>
